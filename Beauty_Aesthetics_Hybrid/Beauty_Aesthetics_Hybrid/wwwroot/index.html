    <script>
        if (navigator.userAgent.toLowerCase().includes('android')) {
            document.documentElement.classList.add('android');
        }

        // ===== PORTRAIT MODE DETECTION =====
        // CSS `orientation` media queries do NOT work reliably inside MAUI BlazorWebView.
        // We detect portrait by comparing innerWidth < innerHeight and apply CSS classes directly.
        window.applyPortraitMode = function () {
            const page = document.querySelector('.case-notes-page');
            if (!page) return;

            const isPhone = window.innerWidth <= 600;

            if (isPhone) {
                page.classList.add('portrait-mode');
                if (window.innerWidth >= 900 && isPortrait) {
                    page.classList.add('portrait-large');
                } else {
                    page.classList.remove('portrait-large');
                }
            } else {
                page.classList.remove('portrait-mode');
                page.classList.remove('portrait-large');
            }
        };

        // Re-apply on resize and orientation change (covers device rotation)
        window.addEventListener('resize', function () {
            window.applyPortraitMode();
        });
        window.addEventListener('orientationchange', function () {
            // Small delay to allow browser to update innerWidth/innerHeight after rotation
            setTimeout(window.applyPortraitMode, 150);
        });

        window.addEventListener('error', function (event) {
            if (event.target && event.target.tagName === 'IMG') {
                const img = event.target;
                const originalSrc = img.getAttribute('src');
                
                if (originalSrc && (originalSrc.startsWith('/images/') || originalSrc.startsWith('images/')) && !img.dataset.resolved) {
                    img.dataset.resolved = 'true';
                    
                    const resolveImg = () => {
                        if (typeof DotNet !== 'undefined') {
                            DotNet.invokeMethodAsync('Beauty_Aesthetics_Hybrid', 'ResolveImage', originalSrc)
                                .then(resolvedSrc => {
                                    if (resolvedSrc) {
                                        img.src = resolvedSrc;
                                    }
                                })
                                .catch(err => console.error('Error in global image resolver:', err));
                        } else {
                            setTimeout(resolveImg, 100);
                        }
                    };
                    resolveImg();
                }
            }
        }, true);
    </script>
