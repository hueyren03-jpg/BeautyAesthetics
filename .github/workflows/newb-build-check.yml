name: NEWB build check

on:
  push:
    branches:
      - NEWB
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Web
        env:
          USERPROFILE: ${{ runner.temp }}
        run: dotnet build Beauty_Aesthetics_Hybrid/Beauty_Aesthetics_Hybrid.Web/Beauty_Aesthetics_Hybrid.Web.csproj -c Debug --nologo
