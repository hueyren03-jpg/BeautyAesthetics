name: Apply product image UI patch

on:
  push:
    branches: [NEWB]
    paths:
      - '.github/workflows/patch-product-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: NEWB
          fetch-depth: 0

      - name: Patch product image UI
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          razor_path = Path('Beauty_Aesthetics_Hybrid/Beauty_Aesthetics_Hybrid.Shared/Components/Pages/Inventory.razor')
          css_path = Path('Beauty_Aesthetics_Hybrid/Beauty_Aesthetics_Hybrid.Shared/Components/Pages/Inventory.razor.css')
          workflow_path = Path('.github/workflows/patch-product-images.yml')

          text = razor_path.read_text(encoding='utf-8')

          old_desktop = '''                                    <td class="product-primary-cell">
                                        <strong title="@item.Type">@DisplayProductValue(item.Type)</strong>
                                        <span title="@item.Brand">@DisplayProductValue(item.Brand)</span>
                                    </td>'''
          new_desktop = '''                                    <td class="product-primary-cell">
                                        <div class="product-table-product">
                                            <div class="product-table-image" aria-hidden="true">
                                                @if (HasInventoryImage(item))
                                                {
                                                    <img src="@ResolveProductImage(item)" alt="" loading="lazy" />
                                                }
                                                else
                                                {
                                                    <i class="bi bi-image"></i>
                                                }
                                            </div>
                                            <div class="product-table-copy">
                                                <strong title="@item.Type">@DisplayProductValue(item.Type)</strong>
                                                <span title="@item.Brand">@DisplayProductValue(item.Brand)</span>
                                            </div>
                                        </div>
                                    </td>'''
          if old_desktop not in text:
              raise SystemExit('Desktop product cell pattern not found')
          text = text.replace(old_desktop, new_desktop, 1)

          old_mobile = '''                                    <td>@item.Type</td>'''
          new_mobile = '''                                    <td>
                                        <div class="product-table-product product-table-product--mobile">
                                            <div class="product-table-image product-table-image--mobile" aria-hidden="true">
                                                @if (HasInventoryImage(item))
                                                {
                                                    <img src="@ResolveProductImage(item)" alt="" loading="lazy" />
                                                }
                                                else
                                                {
                                                    <i class="bi bi-image"></i>
                                                }
                                            </div>
                                            <strong title="@item.Type">@DisplayProductValue(item.Type)</strong>
                                        </div>
                                    </td>'''
          if old_mobile not in text:
              raise SystemExit('Mobile product cell pattern not found')
          text = text.replace(old_mobile, new_mobile, 1)

          old_details = '''                <div class="inventory-view-modal__body">
                    <div class="inventory-view-hero">
                        <div class="inventory-view-hero__item inventory-view-hero__item--primary">
                            <span class="inventory-view-hero__label">PRODUCT NAME</span>
                            <strong class="inventory-view-hero__value">@DisplayProductValue(SelectedProductDetails.Type)</strong>'''
          new_details = '''                <div class="inventory-view-modal__body">
                    <div class="product-details-image-card">
                        <div class="product-details-image" aria-label="Product image">
                            @if (HasInventoryImage(SelectedProductDetails))
                            {
                                <img src="@ResolveProductImage(SelectedProductDetails)"
                                     alt="@DisplayProductValue(SelectedProductDetails.Type)"
                                     loading="lazy" />
                            }
                            else
                            {
                                <div class="product-details-image__placeholder">
                                    <i class="bi bi-image"></i>
                                    <span>No image</span>
                                </div>
                            }
                        </div>
                        <div class="product-details-image__meta">
                            <span>PRODUCT</span>
                            <h3>@DisplayProductValue(SelectedProductDetails.Type)</h3>
                            <p>@DisplayProductValue(SelectedProductDetails.Brand) · @DisplayProductValue(SelectedProductDetails.Sku)</p>
                        </div>
                    </div>

                    <div class="inventory-view-hero">
                        <div class="inventory-view-hero__item inventory-view-hero__item--primary">
                            <span class="inventory-view-hero__label">PRODUCT NAME</span>
                            <strong class="inventory-view-hero__value">@DisplayProductValue(SelectedProductDetails.Type)</strong>'''
          if old_details not in text:
              raise SystemExit('Product details modal pattern not found')
          text = text.replace(old_details, new_details, 1)

          old_edit_copy = '''                                    <div>
                                        <strong>Product image</strong>
                                        <span>Loaded from the product record</span>
                                    </div>'''
          new_edit_copy = '''                                    <div class="product-form__image-copy">
                                        <strong>Product image</strong>
                                        <span>@DisplayProductValue(EditProduct.Type) · @DisplayProductValue(EditProduct.Sku)</span>
                                    </div>'''
          if old_edit_copy not in text:
              raise SystemExit('Edit image copy pattern not found')
          text = text.replace(old_edit_copy, new_edit_copy, 1)

          razor_path.write_text(text, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          marker = '/* Product image surfaces - POS product table, details and edit */'
          if marker not in css:
              css += r'''

/* Product image surfaces - POS product table, details and edit */
.product-table-product {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.product-table-copy {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
}

.product-table-copy strong,
.product-table-copy span,
.product-table-product--mobile > strong {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.product-table-image {
    width: 48px;
    height: 48px;
    min-width: 48px;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #dbe4ef;
    border-radius: 10px;
    background: #f8fafc;
    color: #94a3b8;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .06);
}

.product-table-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.product-table-image i {
    font-size: 20px;
}

.product-table-image--mobile {
    width: 46px;
    height: 46px;
    min-width: 46px;
}

.product-details-image-card {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 18px;
    margin-bottom: 18px;
    border: 1px solid #dbe4ef;
    border-radius: 14px;
    background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
}

.product-details-image {
    width: 152px;
    height: 152px;
    min-width: 152px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #dbe4ef;
    border-radius: 14px;
    background: #f8fafc;
    box-shadow: 0 6px 18px rgba(15, 23, 42, .08);
}

.product-details-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #fff;
}

.product-details-image__placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    color: #94a3b8;
    font-size: .78rem;
    font-weight: 700;
}

.product-details-image__placeholder i {
    font-size: 34px;
}

.product-details-image__meta {
    min-width: 0;
}

.product-details-image__meta > span {
    display: block;
    margin-bottom: 5px;
    color: #64748b;
    font-size: .72rem;
    font-weight: 800;
    letter-spacing: .08em;
}

.product-details-image__meta h3 {
    margin: 0;
    color: #0f172a;
    font-size: 1.35rem;
    line-height: 1.25;
}

.product-details-image__meta p {
    margin: 7px 0 0;
    color: #64748b;
    font-size: .9rem;
}

.product-form__image-preview {
    align-items: center;
    gap: 16px;
}

.product-form__image-frame {
    width: 112px !important;
    height: 112px !important;
    min-width: 112px;
    overflow: hidden;
    border-radius: 12px !important;
    background: #f8fafc;
}

.product-form__image-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #fff;
}

.product-form__image-copy {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.product-form__image-copy strong {
    color: #0f172a;
    font-size: 1rem;
}

.product-form__image-copy span {
    overflow: hidden;
    color: #64748b;
    font-size: .84rem;
    text-overflow: ellipsis;
    white-space: nowrap;
}

@media (max-width: 600px) {
    .product-table-product {
        gap: 10px;
    }

    .product-details-image-card {
        align-items: flex-start;
        gap: 14px;
        padding: 14px;
    }

    .product-details-image {
        width: 112px;
        height: 112px;
        min-width: 112px;
        border-radius: 12px;
    }

    .product-details-image__meta h3 {
        font-size: 1.08rem;
    }

    .product-details-image__meta p {
        font-size: .8rem;
    }

    .product-form__image-frame {
        width: 96px !important;
        height: 96px !important;
        min-width: 96px;
    }
}
'''
              css_path.write_text(css, encoding='utf-8')

          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Commit product image UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Show product images across product views"
          git push origin HEAD:NEWB
