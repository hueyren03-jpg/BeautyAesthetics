name: Apply product image UI patch

on:
  push:
    branches:
      - NEWB
    paths:
      - .github/workflows/patch-product-images.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEWB
        uses: actions/checkout@v4
        with:
          ref: NEWB
          fetch-depth: 0

      - name: Apply product image patch
        run: python .github/product-image-patch.py

      - name: Commit product image UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Show product images across product views"
          git push origin HEAD:NEWB
